<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rhythm — 習慣化トラッカー | NOVA STUDIO</title>
<meta name="description" content="小さな習慣を積み重ねるためのミニマルな習慣化トラッキングアプリ">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>◐</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Cormorant+Garamond:ital,wght@0,600;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f5f1; --ink:#141414; --ink-soft:#5c5850; --line:#dedad2;
  --accent:#ff4b2b; --accent-soft:#ffe3db; --paper:#ffffff;
  --serif:'Cormorant Garamond', serif;
  --sans:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
}
*,*::before,*::after{ box-sizing:border-box; }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); line-height:1.6; -webkit-font-smoothing:antialiased; }
a{ color:inherit; text-decoration:none; }
button{ font-family:inherit; cursor:pointer; }
input{ font-family:inherit; }

.topbar{ display:flex; align-items:center; justify-content:space-between; padding:1.4rem 6vw; border-bottom:1px solid var(--line); }
.back{ font-size:.78rem; color:var(--ink-soft); letter-spacing:.02em; }
.back:hover{ color:var(--accent); }
.applogo{ font-family:var(--serif); font-style:italic; font-weight:600; font-size:1.3rem; display:flex; align-items:center; gap:.5rem; }
.applogo .dot{ width:10px; height:10px; border-radius:50%; background:var(--accent); }

main{ max-width:640px; margin:0 auto; padding:3rem 6vw 6rem; }

.hero{ margin-bottom:2.6rem; }
.hero h1{ font-family:var(--serif); font-weight:600; font-size:clamp(2rem,6vw,2.8rem); margin:0 0 .4rem; }
.hero p{ color:var(--ink-soft); margin:0; font-size:.92rem; }

.summary{ display:flex; gap:1.6rem; margin-bottom:2.6rem; }
.summary-card{ flex:1; background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:1.2rem 1.4rem; }
.summary-num{ font-family:var(--serif); font-size:2.2rem; font-weight:600; color:var(--accent); font-variant-numeric:tabular-nums; }
.summary-label{ font-size:.72rem; color:var(--ink-soft); letter-spacing:.04em; }

.add-form{ display:flex; gap:.6rem; margin-bottom:2.4rem; }
.add-form select{
  border:1px solid var(--line); background:var(--paper); border-radius:12px; font-size:1.1rem;
  padding:0 .6rem; width:3.2rem; appearance:none; text-align:center;
}
.add-form input[type="text"]{
  flex:1; border:1px solid var(--line); background:var(--paper); border-radius:12px;
  padding:.75rem 1rem; font-size:.92rem; outline:none;
}
.add-form input[type="text"]:focus{ border-color:var(--accent); }
.add-form button{
  border:none; background:var(--ink); color:var(--bg); border-radius:12px; padding:0 1.4rem;
  font-size:.82rem; letter-spacing:.03em; font-weight:500; transition:background .25s;
}
.add-form button:hover{ background:var(--accent); }

.habit-list{ display:flex; flex-direction:column; gap:.9rem; }
.habit{
  background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:1.1rem 1.3rem;
  display:flex; align-items:center; gap:1rem;
}
.habit-emoji{ font-size:1.4rem; width:2rem; text-align:center; flex-shrink:0; }
.habit-body{ flex:1; min-width:0; }
.habit-name{ font-weight:700; font-size:.95rem; margin-bottom:.3rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.habit-streak{ font-size:.74rem; color:var(--ink-soft); }
.habit-streak strong{ color:var(--accent); }
.habit-days{ display:flex; gap:.35rem; flex-shrink:0; }
.day-dot{
  width:26px; height:26px; border-radius:50%; border:1.5px solid var(--line); background:transparent;
  display:flex; align-items:center; justify-content:center; font-size:.62rem; color:var(--ink-soft);
  transition:background .2s, border-color .2s, color .2s, transform .15s;
}
.day-dot:hover{ transform:scale(1.1); }
.day-dot.done{ background:var(--accent); border-color:var(--accent); color:#fff; }
.day-dot.today{ border-color:var(--ink); }
.day-dot:disabled{ cursor:default; opacity:.35; }
.habit-del{
  border:none; background:none; color:var(--ink-soft); font-size:1rem; padding:.2rem .4rem; flex-shrink:0;
  opacity:.5; transition:opacity .2s, color .2s;
}
.habit-del:hover{ opacity:1; color:var(--accent); }

.empty{ text-align:center; padding:3.5rem 1rem; color:var(--ink-soft); font-size:.88rem; border:1px dashed var(--line); border-radius:16px; }
.empty span{ display:block; font-family:var(--serif); font-style:italic; font-size:1.3rem; color:var(--ink); margin-bottom:.5rem; }

@media (max-width:520px){
  .habit{ flex-wrap:wrap; }
  .habit-days{ width:100%; justify-content:space-between; order:3; margin-top:.4rem; }
}
</style>
</head>
<body>

<header class="topbar">
  <a href="../../index.html" class="back">← NOVA STUDIO</a>
  <div class="applogo"><span class="dot"></span>Rhythm</div>
</header>

<main>
  <div class="hero">
    <h1>今日も、ひとつ。</h1>
    <p>小さな習慣を積み重ねるためのミニマルなトラッカーです。データはこのブラウザだけに保存されます。</p>
  </div>

  <div class="summary">
    <div class="summary-card">
      <div class="summary-num" id="statToday">0%</div>
      <div class="summary-label">TODAY'S PROGRESS</div>
    </div>
    <div class="summary-card">
      <div class="summary-num" id="statStreak">0</div>
      <div class="summary-label">BEST STREAK</div>
    </div>
  </div>

  <form class="add-form" id="addForm">
    <select id="emojiSelect" aria-label="アイコン">
      <option>◐</option><option>✦</option><option>◈</option><option>☾</option>
      <option>🏃</option><option>📖</option><option>💧</option><option>🧘</option><option>✍️</option>
    </select>
    <input type="text" id="nameInput" placeholder="新しい習慣を入力(例: 読書30分)" maxlength="30" required>
    <button type="submit">追加</button>
  </form>

  <div class="habit-list" id="habitList"></div>
  <div class="empty" id="emptyState" style="display:none;">
    <span>まだ習慣がありません</span>
    上のフォームから最初の習慣を追加してみましょう。
  </div>
</main>

<script>
(() => {
  'use strict';
  const STORE_KEY = 'rhythm_habits_v1';
  const DAY_MS = 86400000;

  const toDateStr = (d) => {
    const yy = d.getFullYear(), mm = String(d.getMonth()+1).padStart(2,'0'), dd = String(d.getDate()).padStart(2,'0');
    return `${yy}-${mm}-${dd}`;
  };
  const today = () => toDateStr(new Date());
  const last7 = () => {
    const arr = [];
    for (let i = 6; i >= 0; i--) arr.push(toDateStr(new Date(Date.now() - i*DAY_MS)));
    return arr;
  };

  let habits = JSON.parse(localStorage.getItem(STORE_KEY) || '[]');
  const save = () => localStorage.setItem(STORE_KEY, JSON.stringify(habits));

  const calcStreak = (habit) => {
    let streak = 0;
    let cursor = new Date();
    const checkinSet = new Set(habit.checkins);
    if (!checkinSet.has(toDateStr(cursor))) cursor = new Date(cursor.getTime() - DAY_MS);
    while (checkinSet.has(toDateStr(cursor))) {
      streak++;
      cursor = new Date(cursor.getTime() - DAY_MS);
    }
    return streak;
  };

  const dayLabel = (dateStr) => {
    const d = new Date(dateStr + 'T00:00:00');
    return ['日','月','火','水','木','金','土'][d.getDay()];
  };

  function render() {
    const list = document.getElementById('habitList');
    const empty = document.getElementById('emptyState');
    list.innerHTML = '';
    empty.style.display = habits.length ? 'none' : 'block';

    const days = last7();
    const t = today();
    let doneToday = 0;
    let bestStreak = 0;

    habits.forEach(habit => {
      if (habit.checkins.includes(t)) doneToday++;
      const streak = calcStreak(habit);
      bestStreak = Math.max(bestStreak, streak);

      const el = document.createElement('div');
      el.className = 'habit';
      el.innerHTML = `
        <div class="habit-emoji">${habit.emoji}</div>
        <div class="habit-body">
          <div class="habit-name">${habit.name}</div>
          <div class="habit-streak">${streak > 0 ? `<strong>🔥 ${streak}日</strong> 連続達成中` : 'まだ記録がありません'}</div>
        </div>
        <div class="habit-days">
          ${days.map(d => `
            <button class="day-dot ${habit.checkins.includes(d) ? 'done' : ''} ${d === t ? 'today' : ''}"
              data-habit="${habit.id}" data-date="${d}" title="${d}">${dayLabel(d)}</button>
          `).join('')}
        </div>
        <button class="habit-del" data-del="${habit.id}" aria-label="削除">✕</button>
      `;
      list.appendChild(el);
    });

    document.getElementById('statToday').textContent =
      habits.length ? Math.round((doneToday / habits.length) * 100) + '%' : '0%';
    document.getElementById('statStreak').textContent = bestStreak;
  }

  document.getElementById('addForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const nameInput = document.getElementById('nameInput');
    const emoji = document.getElementById('emojiSelect').value;
    const name = nameInput.value.trim();
    if (!name) return;
    habits.push({ id: Date.now().toString(36), name, emoji, checkins: [] });
    nameInput.value = '';
    save();
    render();
  });

  document.getElementById('habitList').addEventListener('click', (e) => {
    const dayBtn = e.target.closest('.day-dot');
    if (dayBtn) {
      const habit = habits.find(h => h.id === dayBtn.dataset.habit);
      const date = dayBtn.dataset.date;
      const idx = habit.checkins.indexOf(date);
      if (idx >= 0) habit.checkins.splice(idx, 1); else habit.checkins.push(date);
      save();
      render();
      return;
    }
    const delBtn = e.target.closest('[data-del]');
    if (delBtn) {
      habits = habits.filter(h => h.id !== delBtn.dataset.del);
      save();
      render();
    }
  });

  render();
})();
</script>
</body>
</html>
