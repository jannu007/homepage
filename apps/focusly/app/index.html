<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Focusly — 集中タイマー | NOVA STUDIO</title>
<meta name="description" content="ポモドーロテクニックとアンビエントサウンドを組み合わせた集中タイマーアプリ">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✦</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Shippori+Mincho:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#2b2721; --bg-soft:#353029; --ink:#e8e1d3; --ink-soft:#9c9384; --line:#463f36;
  --accent:#b8734f; --accent-soft:#3a2c22;
  --serif:'Shippori Mincho', serif;
  --sans:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
}
*,*::before,*::after{ box-sizing:border-box; }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); line-height:1.8; -webkit-font-smoothing:antialiased; min-height:100vh; }
a{ color:inherit; text-decoration:none; }
button{ font-family:inherit; cursor:pointer; }

.topbar{ display:flex; align-items:center; justify-content:space-between; padding:1.6rem 8vw; border-bottom:1px solid var(--line); }
.back{ font-size:.78rem; color:var(--ink-soft); letter-spacing:.02em; }
.back:hover{ color:var(--ink); }
.applogo{ font-family:var(--serif); font-weight:400; font-size:1.1rem; display:flex; align-items:center; gap:.7rem; letter-spacing:.05em; }
.hanko{
  display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;
  width:1.5rem; height:1.5rem; border-radius:2px; background:var(--accent); color:var(--bg);
  font-family:var(--serif); font-weight:500; font-size:.82rem; line-height:1; transform:rotate(-2deg); opacity:.92;
}

main{ max-width:500px; margin:0 auto; padding:4.5rem 8vw 5rem; display:flex; flex-direction:column; align-items:center; }

.modes{ display:flex; gap:1px; background:var(--line); margin-bottom:3rem; }
.mode-btn{
  border:none; background:var(--bg-soft); color:var(--ink-soft); font-size:.76rem; letter-spacing:.03em;
  padding:.7rem 1.2rem; transition:background .3s, color .3s;
}
.mode-btn.active{ background:var(--accent); color:var(--bg); }

.ring-wrap{ position:relative; width:min(260px,66vw); height:min(260px,66vw); margin-bottom:2.8rem; }
.ring-wrap svg{ width:100%; height:100%; transform:rotate(-90deg); }
.ring-bg{ fill:none; stroke:var(--line); stroke-width:1; }
.ring-fg{ fill:none; stroke:var(--accent); stroke-width:1; transition:stroke-dashoffset 1s linear; }
.ring-label{
  position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
}
.ring-time{ font-family:var(--serif); font-size:2.9rem; font-weight:300; font-variant-numeric:tabular-nums; }
.ring-state{ font-size:.7rem; color:var(--ink-soft); letter-spacing:.14em; text-transform:uppercase; margin-top:.4rem; }

.controls{ display:flex; gap:1.2rem; margin-bottom:2.8rem; }
.ctrl-btn{
  border:1px solid var(--line); background:transparent; color:var(--ink);
  padding:.9rem 2.1rem; font-size:.8rem; letter-spacing:.06em; font-weight:400; transition:border-color .3s;
}
.ctrl-btn.primary{ border-color:var(--accent); color:var(--accent); }
.ctrl-btn:hover{ border-color:var(--ink); }

.extras{ display:flex; gap:1.2rem; align-items:center; }
.ambient-toggle{
  display:flex; align-items:center; gap:.6rem; border:1px solid var(--line); background:transparent;
  padding:.6rem 1.2rem; font-size:.74rem; color:var(--ink-soft); transition:border-color .3s, color .3s;
}
.ambient-toggle.on{ border-color:var(--accent); color:var(--ink); }
.ambient-toggle .indicator{ width:6px; height:6px; border-radius:50%; background:var(--line); transition:background .3s; }
.ambient-toggle.on .indicator{ background:var(--accent); }

.stats{ margin-top:3.4rem; display:flex; gap:3rem; }
.stat{ text-align:center; }
.stat-num{ font-family:var(--serif); font-weight:300; font-size:1.6rem; color:var(--accent); font-variant-numeric:tabular-nums; }
.stat-label{ font-size:.66rem; color:var(--ink-soft); letter-spacing:.08em; }
</style>
</head>
<body>

<header class="topbar">
  <a href="../index.html" class="back">← Focusly について</a>
  <div class="applogo"><span class="hanko">集</span>Focusly</div>
</header>

<main>
  <div class="modes" id="modes">
    <button class="mode-btn active" data-mode="focus" data-min="25">集中 25分</button>
    <button class="mode-btn" data-mode="short" data-min="5">小休憩 5分</button>
    <button class="mode-btn" data-mode="long" data-min="15">大休憩 15分</button>
  </div>

  <div class="ring-wrap">
    <svg viewBox="0 0 200 200">
      <circle class="ring-bg" cx="100" cy="100" r="90"></circle>
      <circle class="ring-fg" id="ringFg" cx="100" cy="100" r="90"></circle>
    </svg>
    <div class="ring-label">
      <div class="ring-time" id="ringTime">25:00</div>
      <div class="ring-state" id="ringState">Ready</div>
    </div>
  </div>

  <div class="controls">
    <button class="ctrl-btn primary" id="startBtn">Start</button>
    <button class="ctrl-btn" id="resetBtn">Reset</button>
  </div>

  <div class="extras">
    <button class="ambient-toggle" id="ambientBtn"><span class="indicator"></span>アンビエントサウンド</button>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-num" id="sessionCount">0</div>
      <div class="stat-label">SESSIONS TODAY</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="focusMinutes">0</div>
      <div class="stat-label">FOCUS MINUTES</div>
    </div>
  </div>
</main>

<script>
(() => {
  'use strict';
  const STORE_KEY = 'focusly_state_v1';
  const todayStr = () => new Date().toISOString().slice(0,10);

  let state = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
  if (!state || state.date !== todayStr()) {
    state = { date: todayStr(), sessions: 0, minutes: 0 };
  }
  const saveState = () => localStorage.setItem(STORE_KEY, JSON.stringify(state));

  const MODES = { focus: 25, short: 5, long: 15 };
  let currentMode = 'focus';
  let totalSeconds = MODES.focus * 60;
  let remaining = totalSeconds;
  let running = false;
  let timerId = null;

  const ringFg = document.getElementById('ringFg');
  const CIRC = 2 * Math.PI * 90;
  ringFg.style.strokeDasharray = CIRC;

  const ringTime = document.getElementById('ringTime');
  const ringState = document.getElementById('ringState');
  const startBtn = document.getElementById('startBtn');
  const resetBtn = document.getElementById('resetBtn');
  const modesEl = document.getElementById('modes');

  function updateRing() {
    const pct = remaining / totalSeconds;
    ringFg.style.strokeDashoffset = CIRC * (1 - pct);
    const m = Math.floor(remaining / 60).toString().padStart(2,'0');
    const s = Math.floor(remaining % 60).toString().padStart(2,'0');
    ringTime.textContent = `${m}:${s}`;
  }

  function setMode(mode) {
    currentMode = mode;
    totalSeconds = MODES[mode] * 60;
    remaining = totalSeconds;
    running = false;
    clearInterval(timerId);
    startBtn.textContent = 'Start';
    ringState.textContent = mode === 'focus' ? 'Ready' : 'Break';
    [...modesEl.children].forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
    updateRing();
  }

  function tick() {
    remaining--;
    updateRing();
    if (remaining <= 0) {
      clearInterval(timerId);
      running = false;
      startBtn.textContent = 'Start';
      playChime();
      if (currentMode === 'focus') {
        state.sessions++;
        state.minutes += MODES.focus;
        saveState();
        renderStats();
        setMode(state.sessions % 4 === 0 ? 'long' : 'short');
      } else {
        setMode('focus');
      }
    }
  }

  startBtn.addEventListener('click', () => {
    if (running) {
      running = false;
      clearInterval(timerId);
      startBtn.textContent = 'Start';
      ringState.textContent = 'Paused';
    } else {
      running = true;
      startBtn.textContent = 'Pause';
      ringState.textContent = currentMode === 'focus' ? 'Focusing' : 'Break';
      timerId = setInterval(tick, 1000);
    }
  });

  resetBtn.addEventListener('click', () => setMode(currentMode));

  modesEl.addEventListener('click', (e) => {
    const btn = e.target.closest('.mode-btn');
    if (btn) setMode(btn.dataset.mode);
  });

  function renderStats() {
    document.getElementById('sessionCount').textContent = state.sessions;
    document.getElementById('focusMinutes').textContent = state.minutes;
  }

  /* ---------- audio: chime + ambient brown noise (synthesized, no files) ---------- */
  let audioCtx = null;
  const getCtx = () => {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  };

  function playChime() {
    const ctx = getCtx();
    [523.25, 659.25, 783.99].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      const start = ctx.currentTime + i * 0.12;
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(0.18, start + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.001, start + 0.9);
      osc.connect(gain).connect(ctx.destination);
      osc.start(start);
      osc.stop(start + 1);
    });
  }

  let ambientNode = null;
  let ambientGain = null;
  const ambientBtn = document.getElementById('ambientBtn');

  function startAmbient() {
    const ctx = getCtx();
    const bufferSize = 2 * ctx.sampleRate;
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    let lastOut = 0;
    for (let i = 0; i < bufferSize; i++) {
      const white = Math.random() * 2 - 1;
      data[i] = (lastOut + 0.02 * white) / 1.02;
      lastOut = data[i];
      data[i] *= 3.5;
    }
    const source = ctx.createBufferSource();
    source.buffer = buffer;
    source.loop = true;
    ambientGain = ctx.createGain();
    ambientGain.gain.value = 0;
    source.connect(ambientGain).connect(ctx.destination);
    source.start();
    ambientGain.gain.linearRampToValueAtTime(0.12, ctx.currentTime + 1.2);
    ambientNode = source;
  }

  function stopAmbient() {
    if (!ambientNode) return;
    const ctx = getCtx();
    ambientGain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.8);
    const node = ambientNode;
    setTimeout(() => { try { node.stop(); } catch(e){} }, 900);
    ambientNode = null;
  }

  ambientBtn.addEventListener('click', () => {
    const on = ambientBtn.classList.toggle('on');
    if (on) startAmbient(); else stopAmbient();
  });

  setMode('focus');
  renderStats();
})();
</script>
</body>
</html>
